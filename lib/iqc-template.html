  .dim{position:absolute;inset:0;background:rgba(0,0,0,.42)}

  .bubble{
    position:relative;min-width:145px;max-width:658px;width:fit-content;display:inline-block;

    word-wrap:break-word;overflow-wrap:anywhere;
  }
  .bubble::before{
    content:"";position:absolute;left:-13px;top:0;
    border-style:solid;border-width:0 18px 20px 0;
    border-color:transparent var(--bubble) transparent transparent;

  .bubble .time{

  .menu button + button{border-top:1px solid var(--divider)}
  .menu button.danger{color:var(--red)}
  .menu .lbl{flex:1}
  .menu svg{flex:none}

    '☝️': '../assets/emoji-iphone/index-finger.png',
    '🦶': '../assets/emoji-iphone/foot.png',
    '🤳': '../assets/emoji-iphone/selfie.png',
    '💅': '../assets/emoji-iphone/nail-polish.png',
    '👣': '../assets/emoji-iphone/footstep.png',
    '👁️': '../assets/emoji-iphone/eye.png',
    '👁': '../assets/emoji-iphone/eye.png',
    '👀': '../assets/emoji-iphone/eyes.png',
    '👤': '../assets/emoji-iphone/man-emoji-unknown.png',
    '👥': '../assets/emoji-iphone/people-emoji-unknown.png',
    '🗣️': '../assets/emoji-iphone/shouting-man.png',
    '🦷': '../assets/emoji-iphone/tooth.png',
    '👄': '../assets/emoji-iphone/mouth.png',
    '💄': '../assets/emoji-iphone/lipstick.png',
    '💋': '../assets/emoji-iphone/kiss-2.png',
  };
  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function rich(t){
    var out = esc(t);
    var keys = Object.keys(EMOJI_SRC).sort(function(a,b){ return b.length - a.length; });
    keys.forEach(function(k){
      out = out.split(esc(k)).join('<img class="e" src="' + EMOJI_SRC[k] + '" alt="' + esc(k) + '"/>');
    });
    return out;
  }
  var el = document.getElementById('iqc-text');
  var bubbleEl = document.getElementById('iqc-bubble') || (el.closest ? el.closest('.bubble') : el.parentNode);
  var timeEl = document.getElementById('bubble-time');
  // Adaptive bubble: measured message width +100 padding (24 kiri + 76 kanan
  // sebagai zona timestamp), min 145, max 658.
  // No fixed/char-based inline width (old fixed width removed).
  function resizeIQCBubble(){
    if (!bubbleEl || !el) return;
    bubbleEl.style.width = '';
    var msgW = 0;
    try {
      msgW = Math.ceil(el.getBoundingClientRect().width);
    } catch (e) { msgW = 0; }
    if (!msgW) msgW = el.scrollWidth || el.offsetWidth || 0;
    var timeW = 0;
    try {
      if (timeEl) timeW = Math.ceil(timeEl.getBoundingClientRect().width);
    } catch (e) {}
    if (!timeW && timeEl) timeW = timeEl.scrollWidth || timeEl.offsetWidth || 0;
    var minForTime = (timeW || 0) + 100 + 16;
    var minW = Math.max(145, minForTime);
    var w = Math.ceil(msgW + 100);
    w = Math.max(minW, w);
    w = Math.min(658, w);
    bubbleEl.style.width = w + 'px';
  }
  var q = null;
  try { q = new URLSearchParams(location.search); } catch(e) {}
  var t = q && q.get('text');
  var cur = el.textContent || '';
  if (t) { el.innerHTML = rich(t); resizeIQCBubble(); }
  else if (cur.indexOf('{{IQC_TEXT}}') !== -1) { el.innerHTML = rich('Haloo, apa kabar? 🤭'); resizeIQCBubble(); }
  else if (cur) { el.innerHTML = rich(cur); resizeIQCBubble(); }
  else { resizeIQCBubble(); }
  var time = q && q.get('time');
  if (time) {
    document.getElementById('clock').textContent = time;
    document.getElementById('bubble-time').textContent = time;
  }
  resizeIQCBubble();
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(function(){ resizeIQCBubble(); }); }
  window.addEventListener('load', function(){ resizeIQCBubble(); });
})();
</script>
</body>
